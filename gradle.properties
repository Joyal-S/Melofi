# Auralis — Gradle Properties

# Use Android Studio JBR for Gradle execution (JDK 21)
# Prevents system JDK 26 from being used accidentally
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Non-transitive R classes (recommended for modern projects)
android.nonTransitiveRClass=true

# Disable AGP built-in Kotlin to allow KSP compatibility
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
